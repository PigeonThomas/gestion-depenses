vich_uploader:
    db_driver: orm

    mappings:
        factures:
            uri_prefix: /images/factures
            upload_destination: "%kernel.project_dir%/public/images/factures"
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
        reparations:
            uri_prefix: /images/reparations
            upload_destination: "%kernel.project_dir%/public/images/reparations"
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
        vehicules:
            uri_prefix: /images/vehicules
            upload_destination: "%kernel.project_dir%/public/images/vehicules"
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
        users:
            uri_prefix: /images/users
            upload_destination: "%kernel.project_dir%/public/images/users"
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
