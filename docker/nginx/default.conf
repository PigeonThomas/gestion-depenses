server {
    listen 80;                          # écoute sur le port 80
    server_name localhost;
    root /var/www/html/public;          # dossier public de Symfony
    index index.php;

    location / {
        # Si le fichier/dossier n'existe pas, redirige vers index.php
        # C'est ce qui permet le routing Symfony
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        # Passe les fichiers PHP au conteneur php via FastCGI
        fastcgi_pass php:9000;          # "php" = nom du service dans docker-compose
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }

    # Empêche l'accès direct aux fichiers .htaccess (sécurité)
    location ~ /\.ht {
        deny all;
    }
}