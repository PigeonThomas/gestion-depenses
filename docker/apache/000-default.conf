<VirtualHost *:80>
    # Dossier public de Symfony
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # Permet la réécriture d'URL (routing Symfony)
        AllowOverride All
        Require all granted
        Options -Indexes

        # Redirige tout vers index.php si le fichier n'existe pas
        # Équivalent du try_files de Nginx
        FallbackResource /index.php
    </Directory>

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>